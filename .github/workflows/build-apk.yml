name: Build FlixCasa Android APKs

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build static web assets
        run: |
          export NEXT_TELEMETRY_DISABLED=1
          npm run build
          test -f out/index.html

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Sync Capacitor Android
        run: npx --no-install cap sync android

      - name: Build Mobile, TV, and Pro debug APKs
        run: |
          chmod +x android/gradlew
          android/gradlew --no-daemon assembleMobileDebug assembleTvDebug assembleProDebug

      - name: Upload all debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: flixcasa-android-debug-apks
          path: |
            android/app/build/outputs/apk/mobile/debug/**/*.apk
            android/app/build/outputs/apk/tv/debug/**/*.apk
            android/app/build/outputs/apk/pro/debug/**/*.apk
          if-no-files-found: error
