name: Build FlixCasa Android APKs

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: standard
            gradle-task: assembleStandardRelease
          - variant: pro
            gradle-task: assembleProRelease
          - variant: tv
            gradle-task: assembleTvRelease

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export for ${{ matrix.variant }}
        env:
          NEXT_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build ${{ matrix.variant }} Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew ${{ matrix.gradle-task }}

      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlixCasa-${{ matrix.variant }}-APK
          path: |
            android/app/build/outputs/apk/${{ matrix.variant }}/release/*.apk