name: Build FlixCasa Android APKs

on:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build All Android APK Variants
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleProRelease assembleStandardRelease assembleTvRelease

      - name: Upload APKs to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlixCasa-APKs
          path: |
            android/app/build/outputs/apk/pro/release/*.apk
            android/app/build/outputs/apk/standard/release/*.apk
            android/app/build/outputs/apk/tv/release/*.apk