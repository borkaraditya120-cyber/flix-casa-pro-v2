name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Force Build Web Assets
        run: |
          export NEXT_DISABLE_ESLINT=1
          export NEXT_TELEMETRY_DISABLED=1
          export TSC_COMPILE_ON_ERROR=true
          npm run build

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Verify web assets
        run: test -f out/index.html

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleMobileDebug assembleTvDebug assembleProDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flixcasa-android-debug-apks
          path: |
            android/app/build/outputs/apk/mobile/debug/*.apk
            android/app/build/outputs/apk/tv/debug/*.apk
            android/app/build/outputs/apk/pro/debug/*.apk
