name: Build FlixCasa Debug APKs

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: mobile
            gradle-task: assembleMobileDebug
          - variant: tv
            gradle-task: assembleTvDebug
          - variant: universal
            gradle-task: assembleUniversalDebug

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Static Export for ${{ matrix.variant }}
        env:
          NEXT_PUBLIC_APP_VARIANT: ${{ matrix.variant }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build ${{ matrix.variant }} Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew ${{ matrix.gradle-task }}

      - name: Upload ${{ matrix.variant }} Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FlixCasa-${{ matrix.variant }}-Debug-APK
          path: android/app/build/outputs/apk/${{ matrix.variant }}/debug/*.apk
          if-no-files-found: error