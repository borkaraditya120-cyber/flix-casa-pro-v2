name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Dependencies
      run: |
        npm install --yes || true
        npm install @capacitor/core @capacitor/cli @capacitor/android --yes || true

    - name: Build Web Project
      run: |
        npm run build || true

    - name: Sync Capacitor
      run: |
        WEB_DIR="dist"
        if [ -d "build" ]; then WEB_DIR="build"; fi
        if [ -d "out" ]; then WEB_DIR="out"; fi
        if [ -d "public" ] && [ ! -d "dist" ]; then WEB_DIR="public"; fi

        if [ ! -f "capacitor.config.json" ] && [ ! -f "capacitor.config.ts" ]; then
          npx cap init "FlixCasa" "com.flixcasa.app" --web-dir $WEB_DIR || true
        fi

        if [ ! -d "android" ]; then
          npx cap add android || true
        fi

        npx cap sync android || true

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Inject Flavor Fallbacks in Gradle
      run: |
        # Fix Kotlin Duplicate Classes
        if [ -f "android/build.gradle" ]; then
          echo '
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"
                      exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8"
                  }
              }
          }' >> android/build.gradle
        fi

        # Inject Flavor Missing Dimension Strategy into app/build.gradle
        if [ -f "android/app/build.gradle" ]; then
          sed -i '/defaultConfig {/a \        missingDimensionStrategy "version", "pro"' android/app/build.gradle || true
          
          echo '
          android {
              buildTypes {
                  debug {
                      matchingFallbacks = ["debug", "release"]
                  }
                  release {
                      matchingFallbacks = ["release", "debug"]
                  }
              }
          }' >> android/app/build.gradle
        fi

    - name: Build Debug APK
      run: |
        if [ -d "android" ]; then
          cd android
          chmod +x gradlew
          ./gradlew assembleProDebug || ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: FlixCasa-App-Debug-APK
        path: android/app/build/outputs/apk/**/*.apk
        
